---
# Optional convenience runner for deploying the CloudFormation stack.
#
# This file is NOT required to use this project.  The template is
# self-contained and can be deployed with a single `aws cloudformation
# deploy` command -- see the README.  Task is here purely to make
# deploying to many regions at once less tedious.
#
# Install: https://taskfile.dev/installation/
# Usage:   task --list

version: '3'

vars:
  # Base name for the CloudFormation stack.  The environment is appended
  # to it, producing e.g. "christen-production".
  PROJECT_NAME: christen

  # Label for the environment this stack is deployed into.
  ENVIRONMENT: dev

  # How long this stack is expected to live.  Applied as a stack tag so
  # that ephemeral stacks can be told apart from permanent ones.
  LIFETIME: long

  TEMPLATE: cfn-template.yml

  # Stack parameters.  These match the template's own defaults; override
  # them to suit a different tagging standard, e.g.
  #   task deploy PROJECT_TAG_KEY=service ENVIRONMENT_TAG_KEY=stage
  PROJECT_TAG_KEY: project
  ENVIRONMENT_TAG_KEY: environment
  NAME_FORMAT: '{project}-{environment}-{instance_id}'

  # The template creates an IAM role and two inline policies, so
  # CloudFormation requires an explicit IAM acknowledgement.
  CAPABILITIES: CAPABILITY_NAMED_IAM

  # Region used by the single-region tasks (deploy, delete, validate).
  REGION: us-east-1

  # Regions used by the fan-out tasks (deploy:all, delete:all).
  #
  # Left empty, they ask the account which regions it has enabled.  That
  # is deliberate: a hardcoded list goes stale every time AWS opens a
  # region, and listing every region is worse, because opt-in regions are
  # disabled by default and deploying to one fails.  Asking the account
  # gets both right for free.
  #
  # Pin an explicit list to deploy somewhere narrower:
  #   task deploy:all REGIONS="us-east-1 eu-west-1"
  REGIONS: ""

  STACK_NAME: '{{.PROJECT_NAME}}-{{.ENVIRONMENT}}'

tasks:
  default:
    desc: List the available tasks
    cmds:
      - task --list
    silent: true

  deploy:
    desc: Deploy the stack to a single region (REGION=us-east-1)
    cmds:
      - >-
        aws cloudformation deploy
        --template-file {{.TEMPLATE}}
        --stack-name {{.STACK_NAME}}
        --region {{.REGION}}
        --capabilities {{.CAPABILITIES}}
        --no-fail-on-empty-changeset
        --parameter-overrides
        ProjectTagKey={{.PROJECT_TAG_KEY}}
        EnvironmentTagKey={{.ENVIRONMENT_TAG_KEY}}
        NameFormat='{{.NAME_FORMAT}}'
        --tags
        project={{.PROJECT_NAME}}
        environment={{.ENVIRONMENT}}
        lifetime={{.LIFETIME}}

  deploy:all:
    desc: Deploy the stack to every enabled region (or those in REGIONS)
    vars:
      TARGET_REGIONS:
        sh: >-
          {{if .REGIONS}}echo "{{.REGIONS}}"{{else}}aws ec2 describe-regions
          --region {{.REGION}}
          --filters "Name=opt-in-status,Values=opt-in-not-required,opted-in"
          --query "Regions[].RegionName" --output text{{end}}
    cmds:
      - for: { var: TARGET_REGIONS }
        task: deploy
        vars:
          REGION: '{{.ITEM}}'

  delete:
    desc: Delete the stack from a single region and wait for it to finish
    cmds:
      - aws cloudformation delete-stack --stack-name {{.STACK_NAME}} --region {{.REGION}}
      - aws cloudformation wait stack-delete-complete --stack-name {{.STACK_NAME}} --region {{.REGION}}

  delete:all:
    desc: Delete the stack from every enabled region (does not wait)
    vars:
      TARGET_REGIONS:
        sh: >-
          {{if .REGIONS}}echo "{{.REGIONS}}"{{else}}aws ec2 describe-regions
          --region {{.REGION}}
          --filters "Name=opt-in-status,Values=opt-in-not-required,opted-in"
          --query "Regions[].RegionName" --output text{{end}}
    cmds:
      - for: { var: TARGET_REGIONS }
        cmd: aws cloudformation delete-stack --stack-name {{.STACK_NAME}} --region {{.ITEM}}
      - cmd: echo "Deletion requested in all regions. Deletes run asynchronously."
        silent: true

  validate:
    desc: Ask CloudFormation to validate the template
    cmds:
      - aws cloudformation validate-template --template-body file://{{.TEMPLATE}} --region {{.REGION}}

  lint:
    desc: Lint the template and syntax-check the inline Lambda handler
    cmds:
      - cfn-lint {{.TEMPLATE}}
      - python3 scripts/check_handler.py {{.TEMPLATE}}

  test:
    desc: Run the handler tests (pip install pytest pyyaml)
    cmds:
      - pytest tests/ {{.CLI_ARGS}}

  check:
    desc: Run everything CI runs
    cmds:
      - task: lint
      - task: test
