---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
  # The template can break without anyone touching it: AWS deprecates Lambda
  # runtimes on its own schedule, and cfn-lint learns about those
  # deprecations in new releases.  A weekly run surfaces that while it is
  # still a warning rather than a failed deploy.
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

jobs:
  lint:
    name: Lint template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Deliberately unpinned.  New cfn-lint releases are how deprecated
      # Lambda runtimes and other drift get reported, so tracking the
      # latest is the point rather than a risk to be pinned away.
      - name: Install tools
        run: pip install cfn-lint pyyaml

      - name: Lint CloudFormation template
        run: cfn-lint cfn-template.yml

      # cfn-lint does not look inside the inline ZipFile block, so a syntax
      # error in the handler passes its checks and only fails at deploy
      # time.  This catches that.
      - name: Check inline Lambda handler
        run: python3 scripts/check_handler.py cfn-template.yml

      # The Terraform module carries its own copy of the handler, because
      # Terraform cannot read it out of the template.  This fails if the
      # copy has drifted from the template.
      - name: Check Terraform handler matches the template
        run: python3 scripts/check_terraform_handler.py

  test:
    name: Test handler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install pytest pyyaml

      # The tests read the handler back out of the template and run it with
      # boto3 mocked, so the template stays the single source of truth.
      - name: Run tests
        run: pytest tests/ -v

  terraform:
    name: Terraform module
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: terraform-linters/setup-tflint@v4

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Init
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - name: Lint
        run: |
          tflint --init
          tflint --recursive
        env:
          # tflint --init downloads its rulesets from GitHub, which rate
          # limits anonymous requests.
          GITHUB_TOKEN: ${{ github.token }}

      # Plan-only tests against a mocked AWS provider: no credentials are
      # needed and nothing is created.
      - name: Test
        run: terraform test
